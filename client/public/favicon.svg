  <circle cx="32" cy="28" r="10" fill="none" stroke="#bfdbfe" stroke-width="2.5"/>
  <circle cx="28.5" cy="26.5" r="1.4" fill="#bfdbfe"/>
  <circle cx="35.5" cy="26.5" r="1.4" fill="#bfdbfe"/>
  <path d="M27 31.5c1.6 2.2 3.4 3.3 5 3.3s3.4-1.1 5-3.3" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round"/>

